<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculators</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --border:#2a3550; --text:#e7ecf7;
    --muted:#9fb0cf; --accent:#c9a24b; --accent2:#8fb2ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#0b1120,#111a2e); color:var(--text);
    padding:32px 20px; line-height:1.5;
  }
  body[dir="rtl"]{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;}
  .wrap{max-width:820px; margin:0 auto;}
  .top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  h1{font-size:1.6rem; margin:0 0 6px;}
  .sub{color:var(--muted); font-size:.9rem; margin-bottom:8px;}
  .langBtn{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:.85rem; white-space:nowrap;
  }
  .langBtn:hover{border-color:var(--accent);}
  .search{
    width:100%; margin:18px 0 20px; padding:10px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:.9rem;
  }
  ul{list-style:none; padding:0; margin:0; display:grid; gap:10px;}
  li a{
    display:flex; gap:14px; align-items:flex-start; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; color:var(--text); text-decoration:none; transition:.15s border-color;
  }
  li a:hover{border-color:var(--accent);}
  .icon{font-size:1.5rem; line-height:1.2; flex-shrink:0;}
  .name{font-weight:600; color:var(--accent2); font-size:1rem;}
  .desc{display:block; font-size:.82rem; color:var(--muted); margin-top:3px;}
  .path{display:block; font-size:.72rem; color:#5c6a8a; margin-top:4px; font-family:monospace;}
  .empty, .error{color:var(--muted); font-size:.9rem; padding:12px 4px;}
  .error{color:#ff8a8a;}
  footer{margin-top:28px; font-size:.78rem; color:var(--muted);}
  footer a{color:var(--accent2);}
</style>
</head>
<body id="bodyRoot">
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="pageTitle">📐 Calculators</h1>
      <div class="sub" id="pageSub">Auto-generated from this repo — each entry reads its own title/description from its HTML file.</div>
    </div>
    <button class="langBtn" id="langToggle" onclick="toggleLang()">العربية</button>
  </div>
  <input type="text" class="search" id="search" placeholder="Search…" oninput="renderList()">
  <ul id="list"><li class="empty" id="loadingMsg">Loading…</li></ul>
  <footer>Source: <a href="https://github.com/oldhunterr/calculators" target="_blank">github.com/oldhunterr/calculators</a></footer>
</div>

<script>
const USER = "oldhunterr", REPO = "calculators", BRANCH = "master";
// Using GitHub's raw content endpoint for metadata fetches
const RAW_BASE = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`;

const UI = {
  en: {title:"📐 Calculators", sub:"Auto-generated from this repo — each entry reads its own title/description from its HTML file.",
       search:"Search…", loading:"Loading…", empty:"No calculators found yet.", langBtn:"العربية", dir:"ltr"},
  ar: {title:"📐 الحاسبات", sub:"يُنشأ تلقائيًا من هذا المستودع — كل عنصر يقرأ عنوانه ووصفه من ملف HTML الخاص به.",
       search:"بحث…", loading:"جارٍ التحميل…", empty:"لا توجد حاسبات بعد.", langBtn:"English", dir:"rtl"}
};
let lang = localStorage.getItem('idxLang') || 'en';
let items = []; // {path, titleEn, titleAr, descEn, descAr, icon}

function applyLangChrome(){
  const t = UI[lang];
  document.getElementById('htmlRoot').lang = lang;
  document.body.dir = t.dir;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSub').textContent = t.sub;
  document.getElementById('search').placeholder = t.search;
  document.getElementById('langToggle').textContent = t.langBtn;
}

function toggleLang(){
  lang = (lang === 'en') ? 'ar' : 'en';
  localStorage.setItem('idxLang', lang);
  applyLangChrome();
  renderList();
}

// Pull <title>, and optional <meta name="calc:*"> tags, out of a file's raw HTML without executing it.
function extractMeta(html, path){
  const titleMatch = html.match(/<title>([^<]*)<\/title>/i);
  const get = (name) => {
    const m = html.match(new RegExp(`<meta[^>]+name=["']${name}["'][^>]+content=["']([^"']*)["']`, 'i'));
    return m ? m[1] : null;
  };
  const fallbackName = path.split('/').pop().replace(/\.html$/,'')
    .replace(/[-_]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  return {
    path,
    titleEn: get('calc:title') || (titleMatch ? titleMatch[1].trim() : fallbackName),
    titleAr: get('calc:title:ar') || null,
    descEn: get('calc:description') || null,
    descAr: get('calc:description:ar') || null,
    icon: get('calc:icon') || '📄'
  };
}

async function loadList(){
  try{
    // Query GitHub API's tree endpoint recursively
    const treeRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if(!treeRes.ok) throw new Error('GitHub API returned ' + treeRes.status);
    
    const data = await treeRes.json();
    const files = (data.tree || [])
      .filter(f => f.type === 'blob' && f.path.toLowerCase().endsWith('.html'))
      .filter(f => f.path.toLowerCase() !== 'index.html')
      .map(f => f.path);

    if(files.length === 0){
      items = [];
      renderList();
      return;
    }

    items = await Promise.all(files.map(async path => {
      try{
        const res = await fetch(RAW_BASE + path);
        const html = await res.text();
        return extractMeta(html, path);
      }catch(e){
        return {path, titleEn: path, titleAr:null, descEn:null, descAr:null, icon:'📄'};
      }
    }));
    
    items.sort((a,b) => (a.titleEn || a.path).localeCompare(b.titleEn || b.path));
    renderList();
  }catch(err){
    document.getElementById('list').innerHTML =
      `<li class="error">Could not load file list (${err.message}).</li>`;
  }
}

function renderList(){
  const listEl = document.getElementById('list');
  const t = UI[lang];
  const q = (document.getElementById('search').value || '').toLowerCase();

  const filtered = items.filter(it => {
    const hay = [it.titleEn, it.titleAr, it.descEn, it.descAr, it.path].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });

  if(filtered.length === 0){
    listEl.innerHTML = `<li class="empty">${t.empty}</li>`;
    return;
  }

  listEl.innerHTML = filtered.map(it => {
    const title = (lang === 'ar' && it.titleAr) ? it.titleAr : it.titleEn;
    const desc = (lang === 'ar' && it.descAr) ? it.descAr : (it.descEn || '');
    return `<li><a href="${it.path}">
      <span class="icon">${it.icon}</span>
      <span>
        <span class="name">${title}</span>
        ${desc ? `<span class="desc">${desc}</span>` : ''}
        <span class="path">${it.path}</span>
      </span>
    </a></li>`;
  }).join('');
}

applyLangChrome();
loadList();
</script>
</body>
</html>
